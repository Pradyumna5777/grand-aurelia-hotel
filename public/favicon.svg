<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0C68B" />
      <stop offset="50%" stop-color="#C9A961" />
      <stop offset="100%" stop-color="#A8894A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0F0F0F" />

  <!-- Subtle gold border -->
  <rect
    x="1.25"
    y="1.25"
    width="61.5"
    height="61.5"
    rx="12.75"
    stroke="url(#gold)"
    stroke-width="1"
    opacity="0.55"
  />

  <!-- Monogram: stylized 'A' with crown motif -->
  <!-- Central pillar -->
  <path
    d="M32 12 L42 46 H38 L32 24 L26 46 H22 Z"
    fill="url(#gold)"
  />

  <!-- Crossbar -->
  <rect x="24" y="34" width="16" height="2.5" rx="1.25" fill="url(#gold)" />

  <!-- Crown dots above -->
  <circle cx="32" cy="9" r="1.6" fill="url(#gold)" />
  <circle cx="26" cy="11" r="1.1" fill="url(#gold)" opacity="0.8" />
  <circle cx="38" cy="11" r="1.1" fill="url(#gold)" opacity="0.8" />

  <!-- Baseline accent -->
  <rect x="20" y="48" width="24" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.7" />
</svg>